name: Super Bot (2GB)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write   # needed so the bot can commit bot_state.json back to the repo

# Prevents two copies of the bot ever running at once (e.g. a manual trigger
# while the auto-restart is still in flight), which would otherwise double-
# process every Telegram message.
concurrency:
  group: super-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # yt-dlp requires Python 3.11+ as of late 2026. Keep this at 3.12 (or
        # newer) — if a future install fails with a "requires a different
        # Python" error again, that's the first thing to check.
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg aria2

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        # You must add these 4 secrets in GitHub Settings -> Secrets
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        KEY: ${{ secrets.KEY }}
        # Optional: comma-separated Telegram user IDs that skip the password
        # and can see the admin panel, e.g. "111111,222222"
        ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        # Lets the bot commit bot_state.json back to the repo on a graceful
        # shutdown, so logins survive the restart below.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # The timeout command stops the script after 330 minutes (5 hours 30 mins).
        # `timeout` (no -k flag) sends SIGTERM and waits for the process to exit on
        # its own, giving bot.py time to save state and push it before the job ends.
        # '|| true' prevents the workflow from failing when timeout stops the bot.
        timeout 330m python bot.py || true

    - name: Wait 20 seconds
      run: |
        sleep 20

    - name: Restart New Workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh workflow run "${{ github.workflow }}" --ref "${{ github.ref }}"
